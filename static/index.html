<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Terminal (xterm)</title>
<link rel="stylesheet" href="./static/xterm.css">
<style>
  html, body { height:100%; margin:0; background:#111; color:#eee; font-family:ui-monospace, monospace; }
  #layout { display:flex; height:100vh; }
  #sidebar { width: 260px; border-right:1px solid #333; overflow:auto; background:#0f0f0f; }
  #main { position:relative; flex:1; }
  #term { position:absolute; left:0; top:0; right:0; bottom:64px; padding:8px; }
  #bottombar { position:fixed; left:0; right:0; bottom:0; height:56px; background:#1c1f26; border-top:1px solid #333; display:flex; align-items:center; gap:8px; padding:8px; z-index:15; }
  #bottombar button { background:#2a2f3a; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; }
  #path { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #333; color:#9cf; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #path .back { background:#2a2f3a; color:#fff; border:none; padding:2px 8px; border-radius:4px; cursor:pointer; }
  #list { list-style:none; margin:0; padding:0; outline:none; }
  #list li { padding:6px 10px; cursor:pointer; }
  #list li.sel { background:#1f2630; }
  #list li .dir { color:#7ad; }
  #list li .file { color:#eee; }
  #dpad { position:fixed; right:12px; bottom:72px; width:140px; height:140px; z-index:20; }
  #dpad .btn { position:absolute; width:44px; height:44px; background:#2a2f3a; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px; }
  #dp-up { left:48px; top:0; }
  #dp-left { left:0; top:48px; }
  #dp-right { left:96px; top:48px; }
  #dp-down { left:48px; top:96px; }
</style>
<div id="layout">
  <div id="sidebar">
    <div id="path"><button class="back" id="btn-up">⬅</button><span id="path-text"></span></div>
    <ul id="list" tabindex="0"></ul>
  </div>
  <div id="main">
    <div id="term"></div>
  </div>
</div>
<div id="bottombar">
  <button id="act-home">~</button>
  <button id="act-up">..</button>
  <button id="act-lsa">ls -la</button>
  <button id="btn-tab">Tab</button>
  <button id="btn-esc">Esc</button>
  <button id="btn-copy">Copy</button>
  <button id="btn-reset">Reset</button>
  <button id="btn-scroll">ScrollLock: Off</button>
  <button id="clear" style="margin-left:auto">Clear</button>
</div>
<div id="dpad">
  <button class="btn" id="dp-up">↑</button>
  <button class="btn" id="dp-left">←</button>
  <button class="btn" id="dp-right">→</button>
  <button class="btn" id="dp-down">↓</button>
</div>
<script src="./static/xterm.min.js"></script>
<script src="./static/xterm-addon-fit.min.js"></script>
<script>
(async function(){
  const term = new Terminal({ fontFamily: 'Fira Code, ui-monospace, monospace', fontSize: 14, theme: { background: '#111111' }, cursorBlink: true, scrollback: 5000 });
  const fit = new window.FitAddon.FitAddon(); term.loadAddon(fit);
  const termEl = document.getElementById('term');
  term.open(termEl); setTimeout(()=>{ try{ fit.fit(); }catch{} }, 0);
  window.addEventListener('resize', ()=>{ try{ fit.fit(); if(!scrollLock) term.scrollToBottom(); }catch{} });

  let tid=null, cwd=null, items=[], sel=0, focusTarget='explorer', scrollLock=false, homePath=null;

  function setFocus(target){ focusTarget = target; if(target==='explorer'){ document.getElementById('list').focus(); } }

  async function newTerm(){
    const r = await fetch('/api/term/new', {method:'POST'});
    const j = await r.json();
    if(!j.tid){ term.writeln(`\r\n[ERR] ${j.error||'failed start'}`); return; }
    tid=j.tid; cwd=j.home; homePath=j.home; term.writeln(`[OK] terminal ready (tid=${tid})`);
    poll(); loadList(cwd); setFocus('explorer');
  }

  async function poll(){ if(!tid) return; try{ const r=await fetch('/api/term/poll?tid='+encodeURIComponent(tid)); const j=await r.json(); if(j.data){ term.write(j.data); if(!scrollLock){ term.scrollToBottom(); } } }catch{} setTimeout(poll,80); }
  async function send(data){ if(!tid) return; try{ await fetch('/api/term/input',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ tid, data }) }); }catch(e){ term.writeln(`\r\n[ERR] send failed`); } }

  async function loadList(path){ try{ const r=await fetch('/api/list?path='+encodeURIComponent(path)+'&tid='+encodeURIComponent(tid)); const j=await r.json(); if(j.error){ return; } cwd=j.cwd; document.getElementById('path-text').textContent=cwd; items=j.items||[]; sel=0; renderList(); }catch{} }

  function renderList(){ const ul=document.getElementById('list'); ul.innerHTML=''; items.forEach((it,i)=>{ const li=document.createElement('li'); li.className = (i===sel?'sel':''); const span=document.createElement('span'); span.className = it.is_dir?'dir':'file'; span.textContent = (it.is_dir?'📁 ':'📄 ')+it.name; li.appendChild(span); li.onclick=()=>{ sel=i; openItem(); setFocus('explorer'); }; ul.appendChild(li); }); }

  async function openItem(){ const it=items[sel]; if(!it) return; const path=cwd.replace(/\/+$/,'')+'/'+it.name; if(it.is_dir){ await send(`cd "${path.replace(/\"/g,'\\\"')}"\n`); await send(`ls\n`); loadList(path); } else { await send(`xdg-open "${path.replace(/\"/g,'\\\"')}"\n`); } }

  function goUp(){ const up=cwd.replace(/\/+$/,'').replace(/\/[^\/]+$/,'')||'/'; send(`cd "${up.replace(/\"/g,'\\\"')}"\n`); send('ls\n'); loadList(up); }

  // Sidebar keyboard navigation
  const listEl = document.getElementById('list');
  listEl.addEventListener('keydown', (e)=>{ if(e.key==='ArrowDown'){ sel=Math.min(sel+1, items.length-1); renderList(); e.preventDefault(); } else if(e.key==='ArrowUp'){ sel=Math.max(sel-1, 0); renderList(); e.preventDefault(); } else if(e.key==='Enter'){ openItem(); e.preventDefault(); } else if(e.key==='Backspace'){ goUp(); e.preventDefault(); } });
  listEl.addEventListener('click', ()=>setFocus('explorer'));
  termEl.addEventListener('click', ()=>{ focusTarget='terminal'; term.focus(); });

  // D-pad buttons
  document.getElementById('dp-up').onclick = ()=>{ if(focusTarget==='explorer'){ sel=Math.max(sel-1, 0); renderList(); } else { send("\x1b[A"); } };
  document.getElementById('dp-down').onclick = ()=>{ if(focusTarget==='explorer'){ sel=Math.min(sel+1, items.length-1); renderList(); } else { send("\x1b[B"); } };
  document.getElementById('dp-left').onclick = ()=>{ if(focusTarget==='explorer'){ goUp(); } else { send("\x1b[D"); } };
  document.getElementById('dp-right').onclick = ()=>{ if(focusTarget==='explorer'){ openItem(); } else { send("\x1b[C"); } };

  // Header back
  document.getElementById('btn-up').onclick = ()=>{ goUp(); setFocus('explorer'); };

  // Bottom bar actions
  document.getElementById('act-home').onclick = ()=>{ send(`cd ~\n`); send('ls\n'); if(homePath) loadList(homePath); };
  document.getElementById('act-up').onclick = ()=> goUp();
  document.getElementById('act-lsa').onclick = ()=> send('ls -la\n');
  document.getElementById('btn-tab').onclick = ()=> send('\t');
  document.getElementById('btn-esc').onclick = ()=> send('\x1b');
  document.getElementById('btn-copy').onclick = ()=>{ try{ const sel=window.getSelection().toString(); if(sel){ navigator.clipboard.writeText(sel); } }catch{} };
  document.getElementById('btn-reset').onclick = async ()=>{ if(!tid) return; await fetch('/api/term/close',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tid})}); tid=null; term.write('\r\n[reset]\r\n'); await newTerm(); };
  document.getElementById('btn-scroll').onclick = ()=>{ scrollLock=!scrollLock; document.getElementById('btn-scroll').textContent = 'ScrollLock: ' + (scrollLock?'On':'Off'); };
  document.getElementById('clear').onclick = ()=>{ if(tid) fetch('/api/term/clear',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tid})}); };

  term.onData(d => { focusTarget='terminal'; send(d); });

  await newTerm();
})();
</script>
