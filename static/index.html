<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Terminal & File Manager</title>
  <link rel="stylesheet" href="./static/xterm.css">
  <link rel="stylesheet" href="./static/style.css">
</head>
<body>
  <button id="fe-toggle" class="fe-float">☰</button>
  <div id="file-explorer" class="collapsed">
    <div id="fe-header">
      <input id="custom-path" placeholder="Custom path" />
      <button id="fe-goto">Go</button>
      <button id="fe-new-file">+File</button>
      <button id="fe-new-dir">+Folder</button>
      <button id="fe-refresh">↻</button>
      <button id="fe-hidden">Hidden: Off</button>
    </div>
    <div id="cwd-breadcrumb"></div>
    <div id="file-list-container">
      <table id="file-list-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Size</th>
            <th>Modified</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="file-list-body"></tbody>
      </table>
    </div>
    <input type="file" id="fe-upload" style="display:none" multiple>
    <button id="fe-upload-btn">Upload</button>
  </div>

  <div id="main">
    <div id="topbar">
      <div id="active-file">No file</div>
      <div class="actions">
        <button id="theme-toggle">Theme</button>
        <button id="save-btn">Save (Ctrl+S)</button>
      </div>
    </div>
    <div id="editor"></div>
    <div id="h-split"></div>
    <div id="terminal-container"></div>
  </div>

  <div id="preview-modal" style="display:none;">
    <div id="preview-content"></div>
    <button id="preview-close">×</button>
  </div>

  <div id="context-menu" style="display:none;position:absolute;background-color:#333;border:1px solid #555;z-index:100;display:flex;flex-direction:column;">
    <button class="ctx-btn" data-action="run">▶️ Run</button>
    <button class="ctx-btn" data-action="rename">✏️ Rename</button>
    <button class="ctx-btn" data-action="delete">❌ Delete</button>
    <button class="ctx-btn" data-action="download">⬇️ Download</button>
  </div>
  <div id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.51.0/min/vs/loader.min.js"></script>
  <script src="./static/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.8.0/lib/xterm-addon-web-links.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-search@0.14.0/lib/xterm-addon-search.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="./static/app.js"></script>
</body>
</html>
