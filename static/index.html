<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Terminal (xterm)</title>
<link rel="stylesheet" href="./static/xterm.css">
<style>
  html, body { height:100%; margin:0; background:#111; color:#eee; font-family:ui-monospace, monospace; }
  #layout { display:flex; height:100vh; }
  #sidebar { width: 260px; border-right:1px solid #333; overflow:auto; background:#0f0f0f; }
  #main { position:relative; flex:1; }
  #top { position:absolute; top:8px; right:8px; z-index:10; }
  #top button { background:#2a2f3a; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; }
  #term { position:absolute; left:0; top:0; right:0; bottom:0; padding:8px; }
  #path { padding:8px; border-bottom:1px solid #333; color:#9cf; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list { list-style:none; margin:0; padding:0; }
  #list li { padding:6px 10px; cursor:pointer; }
  #list li.sel { background:#1f2630; }
  #list li .dir { color:#7ad; }
  #list li .file { color:#eee; }
</style>
<div id="layout">
  <div id="sidebar">
    <div id="path"></div>
    <ul id="list" tabindex="0"></ul>
  </div>
  <div id="main">
    <div id="top"><button id="clear">Clear</button></div>
    <div id="term"></div>
  </div>
</div>
<script src="./static/xterm.min.js"></script>
<script>
(async function(){
  const term = new Terminal({ fontFamily: 'Fira Code, ui-monospace, monospace', fontSize: 14, theme: { background: '#111111' }, cursorBlink: true, scrollback: 5000 });
  term.open(document.getElementById('term'));
  window.addEventListener('resize', ()=>{ try{ term.scrollToBottom(); }catch{} });

  let tid=null, cwd=null, items=[], sel=0;

  async function newTerm(){
    const r = await fetch('/api/term/new', {method:'POST'});
    const j = await r.json();
    if(!j.tid){ term.writeln(`\r\n[ERR] ${j.error||'failed start'}`); return; }
    tid=j.tid; cwd=j.home; term.writeln(`[OK] terminal ready (tid=${tid})`);
    poll(); loadList(cwd);
  }

  async function poll(){
    if(!tid) return; try{ const r=await fetch('/api/term/poll?tid='+encodeURIComponent(tid)); const j=await r.json(); if(j.data){ term.write(j.data); } }catch{} setTimeout(poll,80);
  }

  async function send(data){ if(!tid) return; try{ await fetch('/api/term/input',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ tid, data }) }); }catch(e){ term.writeln(`\r\n[ERR] send failed`); } }

  async function loadList(path){ try{ const r=await fetch('/api/list?path='+encodeURIComponent(path)+'&tid='+encodeURIComponent(tid)); const j=await r.json(); if(j.error){ return; } cwd=j.cwd; document.getElementById('path').textContent=cwd; items=j.items||[]; sel=0; renderList(); }catch{} }

  function renderList(){ const ul=document.getElementById('list'); ul.innerHTML=''; items.forEach((it,i)=>{ const li=document.createElement('li'); li.className = (i===sel?'sel':''); const span=document.createElement('span'); span.className = it.is_dir?'dir':'file'; span.textContent = (it.is_dir?'📁 ':'📄 ')+it.name; li.appendChild(span); li.onclick=()=>{ sel=i; openItem(); }; ul.appendChild(li); }); }

  async function openItem(){ const it=items[sel]; if(!it) return; const path=cwd.replace(/\/+$/,'')+'/'+it.name; if(it.is_dir){ await send(`cd "${path.replace(/\"/g,'\\\"')}"\n`); await send(`ls\n`); loadList(path); } else { await send(`xdg-open "${path.replace(/\"/g,'\\\"')}"\n`); } }

  document.getElementById('list').addEventListener('keydown', (e)=>{ if(e.key==='ArrowDown'){ sel=Math.min(sel+1, items.length-1); renderList(); e.preventDefault(); } else if(e.key==='ArrowUp'){ sel=Math.max(sel-1, 0); renderList(); e.preventDefault(); } else if(e.key==='Enter'){ openItem(); e.preventDefault(); } else if(e.key==='Backspace'){ // go up
      const up=cwd.replace(/\/+$/,'').replace(/\/[^\/]+$/,'')||'/'; send(`cd "${up.replace(/\"/g,'\\\"')}"\n`); send('ls\n'); loadList(up); e.preventDefault(); }
  });

  term.onData(d => send(d));
  document.getElementById('clear').onclick = ()=>{ if(tid) fetch('/api/term/clear',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tid})}); };

  await newTerm(); document.getElementById('list').focus();
})();
</script>
