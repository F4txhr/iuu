<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Terminal</title>
<style>
  body { background:#111; color:#eee; font-family:ui-monospace, monospace; margin:0; }
  #wrap { display:flex; flex-direction:column; height:100vh; }
  #out { flex:1; padding:10px; white-space:pre-wrap; overflow:auto; background:#000; }
  #bar { display:flex; gap:6px; padding:8px; background:#222; border-top:1px solid #333; }
  #in { flex:1; background:#111; color:#fff; border:1px solid #333; border-radius:4px; padding:6px; }
  button { background:#2a2f3a; color:#fff; border:none; padding:6px 10px; border-radius:4px; }
</style>
<div id="wrap">
  <pre id="out"></pre>
  <div id="bar">
    <input id="in" placeholder="Type command then Enter">
    <button id="send">Send</button>
    <button id="clear">Clear</button>
  </div>
</div>
<script>
(async function(){
  const out = document.getElementById('out');
  const input = document.getElementById('in');
  const sendBtn = document.getElementById('send');
  const clearBtn = document.getElementById('clear');
  let tid = null;

  function append(txt){ out.textContent += txt; out.scrollTop = out.scrollHeight; }

  async function newTerm(){
    const r = await fetch('/api/term/new', {method:'POST'});
    const j = await r.json();
    if(!j.tid){ append('\n[ERR] '+(j.error||'failed start')+'\n'); return; }
    tid = j.tid; append('[OK] terminal ready (tid='+tid+')\n'); poll();
  }

  async function poll(){
    if(!tid) return;
    try{
      const r = await fetch('/api/term/poll?tid='+encodeURIComponent(tid));
      const j = await r.json(); if(j.data){ append(j.data); }
    }catch{}
    setTimeout(poll, 150);
  }

  async function send(cmd){
    if(!tid) return;
    try{
      await fetch('/api/term/input', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tid, data: cmd.endsWith('\n')?cmd:(cmd+'\n') })
      });
    }catch(e){ append('\n[ERR] send failed\n'); }
  }

  sendBtn.onclick = ()=>{ if(input.value) { send(input.value); input.value=''; input.focus(); } };
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ sendBtn.click(); } };
  clearBtn.onclick = ()=>{ if(tid) fetch('/api/term/clear',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tid})}); };

  await newTerm(); input.focus();
})();
</script>
