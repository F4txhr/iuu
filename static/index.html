<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Terminal (xterm)</title>
<link rel="stylesheet" href="./static/xterm.css">
<style>
  html, body { height:100%; margin:0; background:#111; }
  #top { position:fixed; top:8px; right:8px; z-index:10; }
  #top button { background:#2a2f3a; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; }
  #term { position:fixed; left:0; top:0; right:0; bottom:0; padding:8px; }
</style>
<div id="top">
  <button id="clear">Clear</button>
</div>
<div id="term"></div>
<script src="./static/xterm.min.js"></script>
<script>
(async function(){
  const term = new Terminal({
    fontFamily: 'Fira Code, ui-monospace, monospace',
    fontSize: 14,
    theme: { background: '#111111' },
    cursorBlink: true,
    scrollback: 5000
  });
  term.open(document.getElementById('term'));
  window.addEventListener('resize', ()=>{ try{ term.scrollToBottom(); }catch{} });

  let tid = null;
  async function newTerm(){
    const r = await fetch('/api/term/new', {method:'POST'});
    const j = await r.json();
    if(!j.tid){ term.writeln(`\r\n[ERR] ${j.error||'failed start'}`); return; }
    tid = j.tid; term.writeln(`[OK] terminal ready (tid=${tid})`);
    poll();
  }

  async function poll(){
    if(!tid) return;
    try{
      const r = await fetch('/api/term/poll?tid='+encodeURIComponent(tid));
      const j = await r.json(); if(j.data){ term.write(j.data); }
    }catch{}
    setTimeout(poll, 80);
  }

  async function send(data){
    if(!tid) return;
    try{
      await fetch('/api/term/input', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tid, data })
      });
    }catch(e){ term.writeln(`\r\n[ERR] send failed`); }
  }

  term.onData(d => send(d));
  document.getElementById('clear').onclick = ()=>{ if(tid) fetch('/api/term/clear',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tid})}); };

  await newTerm();
})();
</script>
